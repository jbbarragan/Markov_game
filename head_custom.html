<style>
:root{--cf-accent:#947225}.main-content h1{font-weight:650;letter-spacing:-1.3px}.main-content h2{margin-top:2.2rem}.cf-hero{padding:28px;border:1px solid #babfb5;border-left:5px solid #c59d44;border-radius:6px;background:linear-gradient(130deg,#f0f2e9,#e6ece7);color:#263d40;margin:25px 0}.cf-kicker{font:12px monospace;letter-spacing:2px;color:#69765c}.cf-hero h2{margin-top:10px!important;font-size:30px!important;color:#253c3e}.cf-tags{font:12px monospace;color:#3d6659}.cf-game{width:100%;height:1550px;border:1px solid #475965;border-radius:8px;background:#111b23}.cf-note{padding:16px;border-left:3px solid #b18a36;background:#e4b95013}#cf-theme{margin:12px 0;font-size:12px;cursor:pointer;padding:8px;border:1px solid #8e9c9e;border-radius:5px;background:transparent;color:inherit}@media(min-width:66.5rem){.main{max-width:1100px}.main-content-wrap{padding:2rem 3rem}.side-bar{width:calc((100% - 1400px)/2 + 264px);min-width:264px}}@media print{.side-bar,.main-header,#cf-theme,iframe,.btn{display:none!important}.main{margin:0!important}.main-content-wrap{padding:0!important}.cf-hero{break-inside:avoid}}
</style>
<script>document.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('button');b.id='cf-theme';b.textContent='☀ / ☾ Cambiar tema';const host=document.querySelector('.site-header')||document.body;host.append(b);let theme='light';try{theme=localStorage.getItem('cf-theme')||'light';}catch{}function apply(){if(window.jtd)jtd.setTheme(theme);for(const frame of document.querySelectorAll('iframe'))frame.contentWindow.postMessage({theme},location.origin);}b.onclick=()=>{theme=theme==='light'?'dark':'light';try{localStorage.setItem('cf-theme',theme);}catch{}apply();};apply();document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',apply));});</script>
